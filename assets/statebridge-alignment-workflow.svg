<svg xmlns="http://www.w3.org/2000/svg" width="560" height="943" viewBox="0 0 760 1280" role="img" aria-labelledby="title desc">
  <title id="title">StateBridge alignment workflow</title>
  <desc id="desc">Message hidden states and reference token embeddings are centered and whitened, aligned with orthogonal Procrustes, reconstructed, norm calibrated, vocabulary anchored, and returned as a continuous aligned prefix.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <style>
      .sans { font-family: Inter, "Segoe UI", Arial, sans-serif; fill: #1f2937; }
      .math { font-family: "Cambria Math", "Times New Roman", serif; fill: #27364a; }
      .heading { font-size: 26px; font-weight: 700; }
      .label { font-size: 22px; font-weight: 650; }
      .small { font-size: 17px; fill: #526174; }
      .formula { font-size: 25px; }
      .arrow { stroke: #334155; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
      .ref-arrow { stroke: #d99a00; stroke-width: 2.5; stroke-dasharray: 8 7; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="760" height="1280" rx="22" fill="#ffffff"/>

  <text x="380" y="40" text-anchor="middle" class="sans heading">StateBridge Alignment Interface</text>

  <rect x="32" y="72" width="310" height="112" rx="16" fill="#e7f0ff" stroke="#5f86bd" stroke-width="2.5"/>
  <text x="187" y="112" text-anchor="middle" class="sans label">Message Hidden States</text>
  <text x="187" y="153" text-anchor="middle" class="math formula">S = [s₁, …, sₖ]</text>

  <rect x="418" y="72" width="310" height="112" rx="16" fill="#fff0dc" stroke="#dda111" stroke-width="2.5" stroke-dasharray="8 7"/>
  <text x="573" y="112" text-anchor="middle" class="sans label">Reference Embeddings</text>
  <text x="573" y="153" text-anchor="middle" class="math formula">R = W<tspan baseline-shift="sub" font-size="17">emb</tspan>[y₁, …, yₖ]</text>

  <rect x="20" y="218" width="720" height="500" rx="20" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2.5" stroke-dasharray="9 8"/>
  <path d="M187 184 L187 282" class="arrow"/>
  <path d="M573 184 L573 282" class="ref-arrow"/>
  <text x="380" y="258" text-anchor="middle" class="sans heading">1. Procrustes Alignment</text>

  <rect x="52" y="282" width="280" height="92" rx="15" fill="#ffffff" stroke="#334155" stroke-width="2.5"/>
  <text x="192" y="318" text-anchor="middle" class="sans label">Center &amp; Whiten</text>
  <text x="192" y="352" text-anchor="middle" class="math formula">S<tspan baseline-shift="sub" font-size="17">w</tspan></text>

  <rect x="428" y="282" width="280" height="92" rx="15" fill="#ffffff" stroke="#334155" stroke-width="2.5"/>
  <text x="568" y="318" text-anchor="middle" class="sans label">Center &amp; Whiten</text>
  <text x="568" y="352" text-anchor="middle" class="math formula">R<tspan baseline-shift="sub" font-size="17">w</tspan></text>

  <path d="M192 374 C192 420 250 438 300 446" class="arrow"/>
  <path d="M568 374 C568 420 510 438 460 446" class="ref-arrow"/>

  <rect x="140" y="448" width="480" height="120" rx="18" fill="#ffffff" stroke="#334155" stroke-width="2.5"/>
  <text x="380" y="486" text-anchor="middle" class="sans label">Orthogonal Procrustes</text>
  <text x="380" y="526" text-anchor="middle" class="math formula">Q* = arg min ‖S<tspan baseline-shift="sub" font-size="17">w</tspan> Q − R<tspan baseline-shift="sub" font-size="17">w</tspan>‖<tspan baseline-shift="sub" font-size="17">F</tspan>²</text>
  <text x="380" y="552" text-anchor="middle" class="math small">subject to QᵀQ = I</text>

  <path d="M380 568 L380 610" class="arrow"/>

  <rect x="175" y="612" width="410" height="78" rx="15" fill="#ffffff" stroke="#334155" stroke-width="2.5"/>
  <text x="380" y="643" text-anchor="middle" class="sans label">Reconstruct in Embedding Space</text>
  <text x="380" y="673" text-anchor="middle" class="math formula">S̃ = S<tspan baseline-shift="sub" font-size="17">w</tspan> Q* Σ<tspan baseline-shift="sub" font-size="17">R</tspan>½ + μ<tspan baseline-shift="sub" font-size="17">R</tspan></text>

  <rect x="20" y="744" width="720" height="154" rx="20" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2.5" stroke-dasharray="9 8"/>
  <path d="M380 690 L380 770" class="arrow"/>
  <rect x="125" y="770" width="480" height="102" rx="16" fill="#ffffff" stroke="#334155" stroke-width="2.5"/>
  <text x="365" y="809" text-anchor="middle" class="sans label">2. Norm Calibration</text>
  <text x="365" y="848" text-anchor="middle" class="math formula">ŝᵢ = s̃ᵢ · n̄ / ‖s̃ᵢ‖₂</text>
  <rect x="630" y="783" width="78" height="76" rx="14" fill="#fff0dc" stroke="#dda111" stroke-width="2.5" stroke-dasharray="8 7"/>
  <text x="669" y="834" text-anchor="middle" class="math formula">n̄</text>
  <path d="M630 821 L607 821" class="ref-arrow"/>

  <rect x="20" y="916" width="720" height="174" rx="20" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2.5" stroke-dasharray="9 8"/>
  <path d="M365 872 L355 944" class="arrow"/>
  <rect x="95" y="944" width="520" height="118" rx="16" fill="#ffffff" stroke="#334155" stroke-width="2.5"/>
  <text x="355" y="984" text-anchor="middle" class="sans label">3. Vocabulary Anchoring</text>
  <text x="355" y="1028" text-anchor="middle" class="math formula">s̄ᵢ = (1 − α)ŝᵢ + α W<tspan baseline-shift="sub" font-size="17">emb</tspan>[vᵢ*]</text>
  <rect x="638" y="960" width="82" height="86" rx="14" fill="#fff0dc" stroke="#dda111" stroke-width="2.5" stroke-dasharray="8 7"/>
  <text x="679" y="1013" text-anchor="middle" class="math" font-size="21">W<tspan baseline-shift="sub" font-size="14">emb</tspan></text>
  <path d="M638 1003 L617 1003" class="ref-arrow"/>

  <path d="M355 1062 L355 1123" class="arrow"/>

  <rect x="205" y="1126" width="300" height="102" rx="18" fill="#e6f4e4" stroke="#6ea85f" stroke-width="3"/>
  <text x="355" y="1168" text-anchor="middle" class="sans label">Aligned Continuous Prefix</text>
  <text x="355" y="1206" text-anchor="middle" class="math formula">S̄</text>

  <rect x="34" y="1242" width="28" height="18" rx="4" fill="#ffffff" stroke="#334155" stroke-width="2"/>
  <text x="74" y="1258" class="sans small">Processing step</text>
  <rect x="500" y="1242" width="28" height="18" rx="4" fill="#fff0dc" stroke="#dda111" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="540" y="1258" class="sans small">Reference data</text>
</svg>
